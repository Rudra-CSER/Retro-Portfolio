# Local MongoDB for the portfolio.
#   docker compose up -d mongo
# Data persists in the named volume `rudra_mongo`.
services:
  mongo:
    image: mongo:7
    container_name: rudra-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"   # bound to localhost only — not exposed to the tailnet
    volumes:
      - rudra_mongo:/data/db

volumes:
  rudra_mongo:
